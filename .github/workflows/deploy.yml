name: Build & Deploy GG Services Frontend

# ── Trigger: push a version tag e.g. git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*.*.*'

# ── Repo-specific config ──────────────────────────────────────────────────────
env:
  IMAGE_NAME:      lmwcode/ggservices-frontend
  HELM_RELEASE:    ggservices-frontend
  HELM_NAMESPACE:  ggservices
  HELM_CHART_PATH: /opt/ggservices/ggservices-helmcharts/frontend
  HELM_IMAGE_KEY:  webserver.image.tag
  HEALTH_URL:      https://www.glynsgardeningservices.com

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Quality checks (lint + build)
  # ────────────────────────────────────────────────────────────────────────────
  check:
    name: Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build verification
        run: npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build image, scan, push, deploy (only if checks pass)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Build → Scan → Push → Deploy
    runs-on: ubuntu-latest
    needs: check

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Extract version tag ────────────────────────────────────────────────
      - name: Set image tag
        id: tag
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 3. Set up QEMU + buildx for multi-arch ────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 4. Login to Docker Hub ────────────────────────────────────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # ── 5. Build image locally for scanning (amd64 only, no push yet) ─────────
      - name: Build image for scan
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:scan

      # ── 6. Security scan with Trivy ───────────────────────────────────────────
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          exit-code: '1'
          severity: CRITICAL
          ignore-unfixed: true

      # ── 7. Build & push multi-arch image ──────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}
            ${{ env.IMAGE_NAME }}:latest

      # ── 8. Trigger helm chart deploy ─────────────────────────────────────────
      - name: Trigger helm chart workflow
        run: |
          curl -f -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.HELMCHART_DISPATCH_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/88Warren/ggservices-helmchart/dispatches \
            -d '{"event_type":"frontend-deploy","client_payload":{"version":"${{ steps.tag.outputs.VERSION }}"}}'

      # ── 9. Post-deploy health check ───────────────────────────────────────────
      - name: Wait for rollout
        run: sleep 30

      - name: Health check
        run: |
          echo "Resolving DNS for www.glynsgardeningservices.com..."
          nslookup www.glynsgardeningservices.com || echo "DNS lookup failed — domain may not be propagated yet"

          echo "Running health check against ${{ env.HEALTH_URL }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 --retry 3 --retry-delay 5 \
            ${{ env.HEALTH_URL }} 2>&1) || STATUS="curl_error_$?"
          echo "Health check status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health check returned: $STATUS"
            echo "This may be expected if DNS is not yet propagated or TLS is not yet active."
            echo "The deployment itself completed successfully — check the site manually."
          fi

      # ── 10. Summary ───────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "### ✅ Deployed ${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Namespace | \`${{ env.HELM_NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health | \`${{ env.HEALTH_URL }}\` |" >> $GITHUB_STEP_SUMMARY
